  warn_free_reconciliation:
    eligible: 1699
    quarantined_crossover: 2
    with_session_level_warn: 34
    no_session_level_warn: 1663                     # 1699 = 1663 + 34 + 2
    event_level_only_warn_sessions: [session320, session1116, session1274]   # B02 (2 sessions) and I02 (1 session)
    no_warn_incl_event_level: 1660                  # 1663 - 3
    percent_incl_event_level: 97.70
    reason: "B02 (event >= 1,500 g) and I02 (exact duplicate row) are WARN rules that attach to events. Counting them removes 3 further sessions."
