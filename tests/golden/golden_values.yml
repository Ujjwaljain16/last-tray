# GOLDEN VALUES: the test authority for the pipeline. Baseline from the Phase 2 research run
# (research/phase2/), reproduced by hash-stable scripts. The production pipeline must reproduce every figure here.
# A difference is investigated and documented, never tolerated or silently patched.
#
# Fixtures next to this file (phase2_*.csv) are copies of the Phase 2 outputs, kept so the production pipeline can
# overwrite outputs/validation/ without losing the reference.

