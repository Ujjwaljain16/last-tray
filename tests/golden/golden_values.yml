  core_ready_sessions: 1697
  sessions_with_derived_weight: 3341        # every non-quarantined key; the 4 quarantined keys have no canonical weight
  quarantined_sessions_without_weight: 4
  weight_control_matches: 3341              # canonical weight == WP4 rule_weight_sum_g
  event_dispositions: {MODELLABLE: 12260, DUPLICATE_EXCLUDED: 2, QUARANTINED: 22}
  weather_join: {matched_core_ready: 1697, eligible_core_ready: 1697, matched_all: 3341, not_attempted_quarantined: 4, unmatched: 0}
  weather_null_precipitation_core_ready: {r_1h: 67, ri_10min: 25}     # Phase 2 results_c.json
